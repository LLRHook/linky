name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan Git history for secrets
        if: matrix.node == '22'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100 --no-banner .

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: TypeScript build (strict)
        run: npm run build

      - name: Check regional video workers
        run: npm run check:workers

      - name: Test link fixing and bot startup
        run: npm test

      - name: Test deployment safeguards
        run: bash tests/deploy.test.sh

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag linky:ci .

      - name: Scan production image for fixable vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output "$archive"
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" image --scanners vuln --timeout 5m --no-progress \
            --format json --output "$RUNNER_TEMP/linky-container-audit.json" linky:ci
          "$RUNNER_TEMP/trivy" image --scanners vuln --timeout 5m --no-progress \
            --ignore-unfixed --exit-code 1 linky:ci

      - name: Retain complete container vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-vulnerability-report
          path: ${{ runner.temp }}/linky-container-audit.json
          retention-days: 14
          if-no-files-found: warn

      - name: Verify production modules and settings storage
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --volume /app/data linky:ci node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            assert.notEqual(process.getuid(), 0);
            require("./dist/services/SocialLinkService");
            const file = "/app/data/ci-check";
            fs.writeFileSync(file, "writable");
            assert.equal(fs.readFileSync(file, "utf8"), "writable");
            fs.unlinkSync(file);
          '

      - name: Verify private delivery archive and production report
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --volume /app/data --env LINKY_ARCHIVE_RUNTIME_TEST=true
          --mount type=bind,src="${{ github.workspace }}/tests/delivery-archive-runtime.test.mjs",dst=/tmp/delivery-archive-runtime.test.mjs,readonly
          linky:ci node --test /tmp/delivery-archive-runtime.test.mjs

      - name: Verify actual video conversion without network access
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
          --env LINKY_VIDEO_RUNTIME_TEST=true
          --mount type=bind,src="${{ github.workspace }}/tests/video-runtime.test.mjs",dst=/tmp/video-runtime.test.mjs,readonly
          linky:ci node --test /tmp/video-runtime.test.mjs
