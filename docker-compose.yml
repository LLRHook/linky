services:
  linky:
    build: .
    image: linky:latest
    container_name: linky
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - linky-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    stop_grace_period: 15s

volumes:
  linky-data:
