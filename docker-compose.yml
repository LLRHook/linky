services:
  linky:
    build: .
    image: linky:latest
    container_name: linky
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - linky-data:/app/data
    ports:
      - "127.0.0.1:8092:8092"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    stop_grace_period: 15s

volumes:
  linky-data:
