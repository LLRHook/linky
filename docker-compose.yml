services:
  # Keep deployed resource names stable so existing servers upgrade in place.
  wannabet:
    build: .
    image: wanna-bet:latest
    container_name: wannabet
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      # Retain the former economy database for rollback. The link bot never uses it.
      - wannabet-data:/app/data:ro
    stop_grace_period: 15s

volumes:
  wannabet-data:
